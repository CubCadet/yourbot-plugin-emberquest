name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "yourbot-sdk>=0.10.0,<0.11" pytest
      - name: Run tests
        run: pytest tests/ -q
      - name: Platform pre-submit validation
        run: yourbot validate --path .
