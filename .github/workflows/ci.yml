name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "yourbot-sdk>=0.6.1,<0.7" pytest
      - name: Run tests
        run: pytest tests/ -q
      - name: Platform pre-submit validation
        run: yourbot validate --path .
